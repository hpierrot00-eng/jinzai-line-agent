services:
  - type: web
    name: jinzai-line-agent
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8787
      - key: DEFAULT_CLIENT_ID
        value: 00000000-0000-0000-0000-000000000001
      - key: OPENCLAW_MODEL_NAME
        value: openclaw
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SLACK_BOT_TOKEN
        sync: false
      - key: SLACK_SIGNING_SECRET
        sync: false
      - key: SLACK_APPROVAL_CHANNEL_ID
        sync: false
      - key: LINE_HARNESS_SEND_URL
        sync: false
      - key: LINE_HARNESS_API_KEY
        sync: false
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
      - key: LINE_CHANNEL_SECRET
        sync: false
      - key: OPENCLAW_AGENT_URL
        sync: false
      - key: OPENCLAW_AGENT_TOKEN
        sync: false
      - key: ADMIN_API_KEY
        sync: false
